services:
  wallet-click:
    build: .
    container_name: wallet-click
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    ports:
      # Localhost only. Put it on your tailnet with `tailscale serve --bg --https=8443 http://127.0.0.1:8787`,
      # or on the public internet (still behind the password) with `tailscale funnel --bg --https=8443 http://127.0.0.1:8787`.
      # Never write "8787:8787": Docker would publish it on the VPS's public IP and bypass ufw.
      # Change WC_PORT in .env if 8787 is already used on the host.
      - "127.0.0.1:${WC_PORT:-8787}:8787"
    volumes:
      - wc-data:/app/data

volumes:
  wc-data:
